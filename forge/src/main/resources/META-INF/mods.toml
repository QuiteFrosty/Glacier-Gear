modLoader="javafml"
loaderVersion="${loader_version_range}"
license="Apache License version 2.0"
issueTrackerURL="https://github.com/QuiteFrosty/Glacier-Gear/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://gigastudios.netlify.app/"
credits="created by gigastudios"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
